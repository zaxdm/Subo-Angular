@if (store.session(); as session) {
  <div class="column">
    <p class="kicker">Tu cuenta</p>
    <h1 class="h-medium">Mi perfil</h1>

    <section class="card account">
      <span class="avatar">
        {{ initial() }}
        @if (session.avatarUrl; as avatar) {
          <img [src]="avatar" alt="" (error)="$any($event.target).hidden = true" />
        }
      </span>
      <div class="who">
        <strong class="title ellipsis">{{ session.name }}</strong>
        @if (session.email) {
          <span class="muted ellipsis">{{ session.email }}</span>
        }
        <span class="kicker">{{ role() }}</span>
      </div>
    </section>

    <form class="card edit" (ngSubmit)="saveName()">
      <h2 class="title">Tus datos</h2>
      <label class="field">
        <span>Nombre</span>
        <input class="input" name="name" [class.invalid]="missing()" [disabled]="busy()" [(ngModel)]="name" />
        @if (missing()) {
          <small class="problem">Escribe tu nombre</small>
        }
      </label>
      <div class="actions">
        <button type="submit" class="btn" [disabled]="busy()">Guardar nombre</button>
        <button type="button" class="btn outline" [disabled]="busy()" (click)="file.click()">
          <span class="mi">photo_camera</span>
          {{ session.avatarUrl ? 'Cambiar foto' : 'Poner foto' }}
        </button>
        <input #file type="file" hidden accept="image/jpeg,image/png,image/webp" (change)="pickPhoto(file)" />
        @if (session.avatarUrl) {
          <button type="button" class="btn text" [disabled]="busy()" (click)="removePhoto()">Quitar foto</button>
        }
        @if (busy()) {
          <span class="spinner"></span>
        }
        @if (done(); as message) {
          <span class="done">{{ message }}</span>
        }
      </div>
    </form>

    <button type="button" class="btn outline" (click)="store.signOut()">
      <span class="mi">logout</span>
      Cerrar sesión en este navegador
    </button>
  </div>
}
