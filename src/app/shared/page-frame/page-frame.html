<header>
  <div>
    <p class="kicker">{{ label() }}</p>
    <h1 class="h-large">{{ title() }}</h1>
    <p class="muted">{{ subtitle() }}</p>
  </div>
  <button type="button" class="btn outline" [disabled]="loading()" (click)="refresh.emit()">
    @if (loading()) {
      <span class="spinner"></span>
    } @else {
      <span class="mi">refresh</span>
    }
    Actualizar
  </button>
</header>

@if (!ready()) {
  <div class="rest"><span class="spinner big"></span></div>
} @else if (emptyMessage(); as message) {
  <div class="rest muted">{{ message }}</div>
} @else {
  <ng-content />
}
