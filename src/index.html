<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Subo · Micros de Trujillo</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Subo: las líneas de micro de Trujillo, su recorrido, paraderos, pasaje y horario.">
  <meta name="theme-color" content="#FFC629">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Subo">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <!-- El modo oscuro antes de pintar nada, para no parpadear en claro (lo mantiene core/theme.ts). -->
  <!-- Ojo: public/_headers lo permite por su huella; si se cambia este script, hay que recalcularla. -->
  <script>
    (function () {
      var choice = null;
      try { choice = localStorage.getItem('subo.theme'); } catch (e) {}
      var dark = choice === 'dark' || (choice !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    })();
  </script>

  <!-- El acceso con Google: pinta su botón en la ventana de iniciar sesión. -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <!-- Se ve mientras se mira si este navegador tenía una sesión guardada. -->
  <app-root><div class="boot"><span class="spinner"></span></div></app-root>
</body>
</html>
